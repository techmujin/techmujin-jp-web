<svg xmlns="http://www.w3.org/2000/svg" width="300" height="168" viewBox="0 0 300 168" role="img" aria-hidden="true">
  <!-- サムネイル画像が用意されていないコミュニティ用の汎用アイコン。
       他のロゴと見た目の大きさが揃うよう、300x168の枠に対して
       実体が約208x119（面積24,800px²前後）になる倍率で配置している -->
  <g transform="translate(21.8,-3.2) scale(3.56)"
     fill="none" stroke="#6b3fb5" stroke-opacity="0.5" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 中央の人物 -->
    <circle cx="36" cy="16" r="7"/>
    <path d="M24 40c0-6.6 5.4-12 12-12s12 5.4 12 12"/>
    <!-- 左の人物 -->
    <circle cx="17" cy="20" r="5.4"/>
    <path d="M8 39c0-4.9 3.4-9 8-9.9"/>
    <!-- 右の人物 -->
    <circle cx="55" cy="20" r="5.4"/>
    <path d="M64 39c0-4.9-3.4-9-8-9.9"/>
  </g>
</svg>
